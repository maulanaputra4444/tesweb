<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Button Example</title>
    <style>
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #4A90E2;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: 0.3s;
        }

        .button:hover {
            background-color: #357ABD;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hello!</h1>
        <p>Click the button below to test the JavaScript.</p>
        <button class="button" id="testBtn">Get Started</button>
    </div>

    <script>
        // This is the JavaScript
        const myButton = document.getElementById('testBtn');

        myButton.addEventListener('click', function() {
            // 1. Show an alert
            alert("Success! The JavaScript is linked and working.");

            // 2. Change the page background color just for fun
            document.body.style.backgroundColor = "#e1f5fe";

            // 3. Change the button text
            this.textContent = "It Works! 🎉";
            this.style.backgroundColor = "#28a745";
        });
    </script>

</body>
</html>
